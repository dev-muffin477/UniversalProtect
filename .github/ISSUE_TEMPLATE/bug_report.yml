name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [Paper, Fabric]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft, UniversalProtect (`/up status`) and for Fabric the Fabric Loader and Fabric API
      placeholder: "Minecraft 26.3, UniversalProtect 2.1.0"
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database engine
      options: [DuckDB, SQLite, MySQL, ClickHouse]
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Console excerpt
      render: text
