plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Database drivers and YAML are bundled into the mod jar (jar-in-jar)
    implementation include("org.yaml:snakeyaml:2.2")
    implementation include("org.xerial:sqlite-jdbc:3.46.1.3")
    implementation include("org.duckdb:duckdb_jdbc:1.1.3")
    implementation include("com.mysql:mysql-connector-j:8.4.0")
    implementation include("com.clickhouse:clickhouse-jdbc:0.6.5:all")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
