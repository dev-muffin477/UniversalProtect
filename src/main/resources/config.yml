# ============================================================================
#  UniversalProtect - config.yml
#  Pro Welt kann log.* ueberschrieben werden: plugins/UniversalProtect/<welt>.yml
#  Beispiel world_nether.yml:
#      log.chat: false
#      log.kills: false
# ============================================================================

database:
  # duckdb (Standard, lokal) | sqlite | mysql | clickhouse
  # Live wechseln (nur Konsole): /up migrate-db <typ> [--full-validation]
  type: duckdb
  sqlite:
    file: database.db
  duckdb:
    file: database.duckdb
  mysql:
    host: localhost
    port: 3306
    database: universalprotect
    username: root
    password: ''
    parameters: useSSL=false&allowPublicKeyRetrieval=true
  clickhouse:
    host: localhost
    port: 8123
    database: universalprotect
    username: default
    password: ''
    ssl: false

# Was protokolliert wird
log:
  block: true
  block-changes: true   # Block-Updates (Gras -> Trampelpfad usw.): -block alt, +block neu
  container: true
  items: true           # drop, throw, shoot, destroy, create, tool-break
  pickup: false         # Aufheben von Items (sehr viele Eintraege)
  interact: true
  signs: true
  frames: true          # Item-Rahmen und Gemaelde
  chat: true
  commands: true
  kills: true
  deaths: true
  sessions: true
  inventory: true       # Crafting, Droppen, Aufheben im Spielerinventar
  spawns: true          # Spawn-Eier, Armorstands, Boote ...
  usernames: true
  trades: true          # Villager-Handel (sell/buy)
  ender: true           # Ender-Chest

# Alarm bei diesen Bloecken (/up alerts)
alerts:
  blocks:
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - ANCIENT_DEBRIS
  cooldown-seconds: 10

# Eintraege automatisch loeschen, die aelter als X Tage sind (0 = aus)
auto-purge-days: 0

lookup:
  default-lines: 15
  max-lines: 100

preview:
  max-blocks: 20000
  timeout-seconds: 120

rollback:
  time-budget-ms: 20

# Networking-API fuer Client-Mods (coreprotect:handshake / coreprotect:data)
networking:
  enabled: true
